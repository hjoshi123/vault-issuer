apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-issuer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vault-issuer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault-issuer.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vault-issuer.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vault-issuer
          image: {{ include "vault-issuer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --cluster-resource-namespace={{ include "vault-issuer.clusterResourceNamespace" . }}
            - --issuer-ambient-credentials={{ .Values.issuerAmbientCredentials }}
            - --cluster-issuer-ambient-credentials={{ .Values.clusterIssuerAmbientCredentials }}
            - --max-retry-duration={{ .Values.maxRetryDuration }}
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --leader-election-lease-duration={{ .Values.leaderElection.leaseDuration }}
            - --leader-election-renew-deadline={{ .Values.leaderElection.renewDeadline }}
            - --readiness-probe-port={{ .Values.readinessProbePort }}
            - --readiness-probe-path=/readyz
            - --log-format={{ .Values.logFormat }}
            - --log-level={{ .Values.logLevel }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            # The manager serves metrics on controller-runtime's default
            # address. The --metrics-port flag is currently inert: app.go leaves
            # the Metrics options commented out.
            - name: metrics
              containerPort: 8080
              protocol: TCP
            # Liveness and readiness share one server, at --readiness-probe-port.
            - name: probes
              containerPort: {{ .Values.readinessProbePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
