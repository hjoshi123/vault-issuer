apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-issuer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vault-issuer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault-issuer.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vault-issuer.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vault-issuer
          image: {{ include "vault-issuer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --cluster-resource-namespace={{ include "vault-issuer.clusterResourceNamespace" . }}
            - --issuer-ambient-credentials={{ .Values.issuerAmbientCredentials }}
            - --cluster-issuer-ambient-credentials={{ .Values.clusterIssuerAmbientCredentials }}
            - --max-retry-duration={{ .Values.maxRetryDuration }}
            - --leader-elect=true
            - --leader-election-namespace={{ .Release.Namespace }}
            - --zap-log-level={{ .Values.logLevel }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
