{{/*
The rules below are generated from the +kubebuilder:rbac markers in
internal/controller by `make generate-rbac`, which writes files/role.yaml.
Edit the markers, not this file.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vault-issuer.fullname" . }}
  labels:
    {{- include "vault-issuer.labels" . | nindent 4 }}
{{- with (.Files.Get "files/role.yaml" | fromYaml) }}
rules:
  {{- toYaml .rules | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vault-issuer.fullname" . }}
  labels:
    {{- include "vault-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vault-issuer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vault-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{/*
Leader election is namespaced to the release namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vault-issuer.fullname" . }}:leaderelection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vault-issuer.fullname" . }}:leaderelection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vault-issuer.fullname" . }}:leaderelection
subjects:
  - kind: ServiceAccount
    name: {{ include "vault-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
