# Dev mode: Vault starts unsealed, in-memory, with a known root token. Nothing
# here is suitable outside a throwaway test cluster.
global:
  tlsDisable: true
injector:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    pullPolicy: Never
  dev:
    enabled: true
  dataStorage:
    enabled: false
  standalone:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
